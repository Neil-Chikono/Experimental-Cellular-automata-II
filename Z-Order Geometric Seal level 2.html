    <script>



let angle = 0;
let w = 24; // width of each 
let ma;
let maxD;
let cam;
let delta = 0.01;
let plants

let bgImage;



     
        function setup() {
           
            
            const canvas = createCanvas(500, 450, WEBGL); 
            canvas.parent('p5-frame')
            
  ma = atan(cos(QUARTER_PI/PI));
  maxD = dist(0, 0, 200, 200);
  
  cam = createCamera();
            
            // p5.js sketch code
            background(255);
           
        }

        function draw() {
   

background(120); 
ortho(-400, 400, 400, -400, 0, 1000);
rotateX(-ma * 3.14);
rotateY(-QUARTER_PI );





///this set of for loops control the width and height of the shape orignally they were set to the width and height of canavas 
// i have made the width and height of the strucutre bigger than the screen so more focus can be placed epicentre of the shape 
// the shape takes on elements of a flower but also strutural elements of a garden terrain. 
// im very interested in finding ways how make P5js do extrme and unpreditable things 

for (let z = 0; z < 1000; z += w) {
for (let x = 0; x < 1700; x += w) {
push();
let d = dist(x, z, width / 2, height / 2);


//Creatig oscilation

let offset = map(d, 0.9, maxD, -PI, PI*PI); //controls the ripling of the sketch

let rn = random(0.1, PI/100);

let a = angle + offset + rn/2; // this formula controls rippling and speed i experimentd with diffrent arthimatic that would make it more chaotic. 




let h = floor(map(sin(a), -1, 1, 100, 300));
translate(x - width / 2, 0, z - height / 2);
normalMaterial();




  
 box (w,h, w); // the orginal box code that produced the gift interestects with the second box making its fluctiations more jarring and hyperdimesional 

rotateX(frameCount * 0.01);
box((w/(10/20)*2), h, w); // experiemnting with making the width and hieght responsive to a changing input by applying mouseX or mouseY





pop();


}
}



angle -= 0.1 ; // 0.1
  
 
  

        }
